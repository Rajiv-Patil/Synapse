server:
  port: 8080

spring:
  application:
    name: synapse-oauth-test
  security:
    oauth2:
      client:
        registration:
          cognito:
            client-id: "test-client-id"
            client-secret: "test-client-secret"
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - openid
        provider:
          cognito:
            issuer-uri: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_mock"
            user-name-attribute: "sub"
      resourceserver:
        jwt:
          issuer-uri: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_mock"

app:
  frontend:
    redirect-url: "http://localhost:5173/chat"
