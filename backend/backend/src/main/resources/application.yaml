server:
  port: 8080

spring:
  profiles:
    default: legacy
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/backend/.env[.properties]
  application:
    name: synapse-oauth
  security:
    oauth2:
      client:
        registration:
          cognito:
            client-id: "${clientId}"
            client-secret: "${clientSecret}"
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - openid

        provider:
          cognito:
            issuer-uri: "https://cognito-idp.${region}.amazonaws.com/${userPoolId}"
            user-name-attribute: "sub"

      resourceserver:
        jwt:
          issuer-uri: "https://cognito-idp.${region}.amazonaws.com/${userPoolId}"

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/synapse}"
    username: "${SPRING_DATASOURCE_USERNAME:synapse_app}"
    password: "${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: "${SPRING_DATA_REDIS_HOST:localhost}"
      port: "${SPRING_DATA_REDIS_PORT:6379}"
      timeout: 2000ms

management:
  health:
    redis:
      enabled: false

app:
  cognito:
    domain: "${cognitoDomain}"
  frontend:
    redirect-url: http://localhost:5174/chat

langchain4j:
  enabled: true
  groq:
    api-key: "${GROQ_API_KEY:}"
  hugging-face:
    chat-model:
      model-id: mistralai/Mistral-7B-Instruct-v0.3
      temperature: 0.7
      timeout: PT60S
      access-token: "${HUGGING_FACE_API_KEY:}"
