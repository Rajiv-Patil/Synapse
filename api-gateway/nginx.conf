server {
    listen 8080;
    server_name _;
    client_max_body_size 32m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /_identity_auth {
        internal;
        set $identity_service identity-service:8080;
        proxy_pass http://$identity_service/api/internal/auth-context;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
    }

    location /oauth2/ {
        set $identity_service identity-service:8080;
        proxy_pass http://$identity_service;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /login/ {
        set $identity_service identity-service:8080;
        proxy_pass http://$identity_service;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/auth/ {
        set $identity_service identity-service:8080;
        proxy_pass http://$identity_service;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/conversations {
        auth_request /_identity_auth;
        auth_request_set $authenticated_sub $upstream_http_x_authenticated_sub;
        auth_request_set $authenticated_user_id $upstream_http_x_authenticated_user_id;
        proxy_set_header X-Authenticated-Sub $authenticated_sub;
        proxy_set_header X-Authenticated-User-Id $authenticated_user_id;
        proxy_set_header Cookie "";
        set $conversation_service conversation-service:8080;
        proxy_pass http://$conversation_service;
    }

    location /api/csv/ {
        auth_request /_identity_auth;
        auth_request_set $authenticated_sub $upstream_http_x_authenticated_sub;
        auth_request_set $authenticated_user_id $upstream_http_x_authenticated_user_id;
        proxy_set_header X-Authenticated-Sub $authenticated_sub;
        proxy_set_header X-Authenticated-User-Id $authenticated_user_id;
        proxy_set_header Cookie "";
        set $dataset_service dataset-service:8080;
        proxy_pass http://$dataset_service;
    }

    location /api/chat {
        auth_request /_identity_auth;
        auth_request_set $authenticated_sub $upstream_http_x_authenticated_sub;
        auth_request_set $authenticated_user_id $upstream_http_x_authenticated_user_id;
        proxy_set_header X-Authenticated-Sub $authenticated_sub;
        proxy_set_header X-Authenticated-User-Id $authenticated_user_id;
        proxy_set_header Cookie "";
        set $ai_chat_service ai-chat-service:8080;
        proxy_pass http://$ai_chat_service;
    }

    location / {
        set $identity_service identity-service:8080;
        proxy_pass http://$identity_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
